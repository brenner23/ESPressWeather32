; ESPressWeather32 - Wetteranzeige fuer ESP32-Displays (CYD, NM-TV-154, MiniTV ESP32-C2).
; Zugangsdaten stehen NICHT hier: WLAN/OpenWeather/MQTT im Einrichtungs-Portal,
; OTA-Passwort und OTA-Adressen in secrets.ini (Vorlage: secrets.example.ini).
[platformio]
default_envs = cyd_usb
extra_configs = secrets.ini
src_dir = src
include_dir = include

; Standardwerte, falls es keine secrets.ini gibt (secrets.ini ueberschreibt sie).
[secrets]
use_secrets =
ota_pass    =
; OTA (Update per WLAN): IP-Adresse DEINES Geraets in secrets.ini eintragen!
; Die IP steht im Dashboard (Wi-Fi) und auf der seriellen Konsole beim Start.
ota_ip_cyd  = 192.168.0.100
ota_ip_nmtv = 192.168.0.100
ota_ip_c2   = 192.168.0.100
device_name = ESPressWeather32
hostname    = espressweather
wifi_ssid   =
wifi_pass   =
ow_key      =
ow_city     =
ow_country  = DE
ow_lang     = de
ow_units    = metric
timezone    = CET-1CEST,M3.5.0,M10.5.0/3
mqtt_port   = 1883
mqtt_user   =
mqtt_pass   =

[common]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board     = esp32dev
framework = arduino

; Kein Reset / kein Bootloader beim Oeffnen des seriellen Monitors
monitor_rts = 0
monitor_dtr = 0

board_build.partitions  = min_spiffs.csv
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB

monitor_speed = 115200
lib_ldf_mode  = deep+

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0
    adafruit/Adafruit GFX Library @ 1.12.6
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
    bblanchon/ArduinoJson @ 7.4.3
    mlesniew/PicoMQTT @ 1.3.0

; WX_WEB_PREVIEW: 1 = Displaybild als Debug-Vorschau im Web (/api/screen), 0 = nicht eingebaut (Standard)
; WICHTIG: keine ;-Kommentare INNERHALB der build_flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"
    -DARDUINO_ARCH_ESP32
    -DWX_WEB_PREVIEW=0
    -DOTA_PASSWORD=\"${secrets.ota_pass}\"
    -DWX_USE_SECRETS=0${secrets.use_secrets}
    -DWX_S_NAME=\"${secrets.device_name}\"
    -DWX_S_HOST=\"${secrets.hostname}\"
    -DWX_S_SSID=\"${secrets.wifi_ssid}\"
    -DWX_S_WPASS=\"${secrets.wifi_pass}\"
    -DWX_S_OWKEY=\"${secrets.ow_key}\"
    -DWX_S_OWCITY=\"${secrets.ow_city}\"
    -DWX_S_OWCTRY=\"${secrets.ow_country}\"
    -DWX_S_OWLANG=\"${secrets.ow_lang}\"
    -DWX_S_OWUNITS=\"${secrets.ow_units}\"
    -DWX_S_TZ=\"${secrets.timezone}\"
    -DWX_S_MQPORT=\"${secrets.mqtt_port}\"
    -DWX_S_MQUSER=\"${secrets.mqtt_user}\"
    -DWX_S_MQPASS=\"${secrets.mqtt_pass}\"
    -I include
    -I include/Fonts
    -Wno-deprecated-declarations
    -Werror=return-type
    -w

; ---------------- CYD ESP32-2432S028 ----------------
[env:cyd_usb]
extends         = common
build_flags     = ${common.build_flags} -DBOARD_CYD
upload_protocol = esptool
upload_speed    = 921600

[env:cyd_ota]
extends         = common
build_flags     = ${common.build_flags} -DBOARD_CYD
upload_protocol = espota
upload_port     = ${secrets.ota_ip_cyd}   ; <- IP aus secrets.ini (ota_ip_cyd) anpassen
upload_flags =
    --port=3232
    --auth=${secrets.ota_pass}

; ---------------- NM-TV-154 (NerdMiner TV) ----------------
[env:nmtv_usb]
extends         = common
build_flags     = ${common.build_flags} -DBOARD_NMTV154
upload_protocol = esptool
upload_speed    = 921600

[env:nmtv_ota]
extends         = common
build_flags     = ${common.build_flags} -DBOARD_NMTV154
upload_protocol = espota
upload_port     = ${secrets.ota_ip_nmtv}   ; <- IP aus secrets.ini (ota_ip_nmtv) anpassen
upload_flags =
    --port=3232
    --auth=${secrets.ota_pass}

; ---------------- MiniTV ESP32-C2 (ein Kern) ----------------
; Arduino fuer den C2 kommt aus dem Tasmota-Build (wie bei ESPressDuino).
[env:c2_usb]
extends         = common
platform        = espressif32
board           = esp32-c2-devkitm-1
build_flags     = ${common.build_flags} -DBOARD_C2
upload_protocol = esptool

[env:c2_ota]
extends         = env:c2_usb
upload_protocol = espota
upload_port     = ${secrets.ota_ip_c2}   ; <- IP aus secrets.ini (ota_ip_c2) anpassen
upload_flags =
    --port=3232
    --auth=${secrets.ota_pass}
