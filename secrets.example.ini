; Vorlage: als secrets.ini kopieren und ausfuellen. secrets.ini kommt nie ins Repo.
; Die Datei ist freiwillig - ohne sie (oder mit use_secrets = 0) richtest du das
; Geraet ueber das Einrichtungs-Portal ein (WLAN "ESPressWeather-XXXX", http://192.168.4.1).
; Hinweis: Werte ohne Leerzeichen eintragen (sonst lieber das Portal benutzen).
[secrets]
; 1 = Zugangsdaten unten verwenden, KEIN Portal (Browser-Einstellungen gesperrt)
; 0 oder leer = Einrichtung ueber das Portal
use_secrets = 0
device_name = ESPressWeather32
hostname    = espressweather
wifi_ssid   =
wifi_pass   =
; OpenWeather (kostenloser Key: https://openweathermap.org)
ow_key      =
ow_city     =
ow_country  = DE
; de oder en (auch Sprache der Anzeige)
ow_lang     = de
; metric (Celsius) oder imperial (Fahrenheit)
ow_units    = metric
timezone    = CET-1CEST,M3.5.0,M10.5.0/3
; Energie-Ansicht: dieses Display ist der MQTT-Broker fuer eine Tasmota-Steckdose
mqtt_port   = 1883
mqtt_user   =
mqtt_pass   =
; Passwort fuer Updates per WLAN (OTA). Leer = ohne Passwort.
ota_pass    =
; Updates per WLAN (OTA): IP-Adresse deines Geraets fuer die *_ota-Umgebungen.
; Steht im Dashboard unter Wi-Fi und auf der Konsole beim Start. UNBEDINGT anpassen!
ota_ip_cyd  = 192.168.0.100
ota_ip_nmtv = 192.168.0.100
ota_ip_c2   = 192.168.0.100
